name: Release Package

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for SourceLink

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
        # Prepares dotnet nuget to authenticate with GitHub Packages using GITHUB_TOKEN
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Pack
      run: dotnet pack src/XsvHcdtHelper/XsvHcdtHelper.csproj -c Release -p:PackageVersion=${{ env.VERSION }} -p:ContinuousIntegrationBuild=true -o ./packages

    - name: Push to GitHub Packages
      run: dotnet nuget push ./packages/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate